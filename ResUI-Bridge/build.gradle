plugins {
    id 'java'
}

group = 'com.resui'
version = '0.1.24'

repositories {
    mavenCentral()
    // Paper API
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // 服务端提供，仅编译期需要
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    // Residence API（libs 下为官方 release jar），运行时由服务器上的 Residence 提供
    compileOnly files('libs/Residence6.0.0.1.jar')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    // 声明输入，避免版本号变化时被增量构建跳过
    inputs.property 'version', project.version
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}

jar {
    archiveBaseName = 'ResUI-Bridge'
}

// 构建完成后自动把插件部署到本机测试服的 plugins 目录，并清掉旧版本（否则 Paper 会同时看到多个）
// 路径可用 -PtestServerPlugins=... 覆盖；目录不存在时自动跳过（例如这台机器上没有 E 盘）
def testServerPlugins = providers.gradleProperty('testServerPlugins').getOrElse('D:/1.21.11/plugins')

tasks.register('deployToTestServer', Copy) {
    onlyIf { file(testServerPlugins).isDirectory() }
    from tasks.named('jar')
    into testServerPlugins
    doFirst {
        file(testServerPlugins).listFiles()?.findAll {
            it.name.startsWith('ResUI-Bridge-') && it.name != "ResUI-Bridge-${project.version}.jar"
        }?.each { it.delete() }
    }
}

tasks.named('build') {
    finalizedBy 'deployToTestServer'
}